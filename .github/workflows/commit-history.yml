name: Commit history

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  commits:
    name: Push conventional commits
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Report new nonconforming commits
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
          PUSHED_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          python3 scripts/check_conventional_commits.py \
            --base "$BEFORE_SHA" \
            --head "$HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --pushed-branch "$PUSHED_BRANCH"
