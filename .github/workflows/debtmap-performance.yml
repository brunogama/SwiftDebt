name: Debtmap performance budgets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-budgets:
    name: Equivalent SwiftSCMA workload budgets
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BASELINE_COMMIT: b0ae66be2065084b29b8b5da0a86d5cd049feced
      FULL_EVIDENCE_COMMIT: 61adcc22a6d63ee7d6ec5d2e3b81e843d34a2a71

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build candidate and reference analyzers
        shell: bash
        run: |
          set -euo pipefail

          git worktree add --detach "$RUNNER_TEMP/scma-baseline" "$BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/scma-full-evidence" "$FULL_EVIDENCE_COMMIT"
          swift build -c release
          swift build --package-path "$RUNNER_TEMP/scma-baseline" -c release
          swift build --package-path "$RUNNER_TEMP/scma-full-evidence" -c release

      - name: Measure baseline analysis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/performance
          common=(
            --input Examples/Sources/Example.swift
            --input .scma.example.json
            --analyzer SwiftSCMA
            --workload-family SwiftSCMA
            --command-fingerprint "scma analyze frozen-examples --format json --jobs 1"
            --analysis-mode baseline
            --optional-context none
          )
          python3 scripts/run_debtmap_benchmark.py \
            --output artifacts/performance/baseline-reference.json \
            "${common[@]}" -- \
            "$RUNNER_TEMP/scma-baseline/.build/release/scma" analyze "$GITHUB_WORKSPACE/Examples/Sources" \
            --format json --jobs 1 --output "$RUNNER_TEMP/baseline-reference-report.json"
          python3 scripts/run_debtmap_benchmark.py \
            --output artifacts/performance/baseline-candidate.json \
            "${common[@]}" -- \
            .build/release/scma analyze Examples/Sources \
            --format json --jobs 1 --output "$RUNNER_TEMP/baseline-candidate-report.json"
          .build/release/scma performance-gate \
            artifacts/performance/baseline-reference.json \
            artifacts/performance/baseline-candidate.json \
            --name baseline-analysis \
            --max-wall-clock-regression 10 \
            --max-peak-memory-regression 15 \
            --output artifacts/performance/baseline-evaluation.json
          .build/release/scma analyze Examples/Sources \
            --format json --jobs 1 \
            --output "$RUNNER_TEMP/baseline-profile-report.json" \
            --profile-output artifacts/performance/baseline-candidate-profile.json

      - name: Measure full-evidence analysis
        shell: bash
        run: |
          set -euo pipefail

          common=(
            --input Examples/Sources/Example.swift
            --input .scma.example.json
            --analyzer SwiftSCMA
            --workload-family SwiftSCMA
            --command-fingerprint "scma debt analyze frozen-examples --format debt-json --jobs 1 --lcov canonical.lcov"
            --analysis-mode full-evidence
            --optional-context coverage-and-repository-history
          )
          python3 scripts/run_debtmap_benchmark.py \
            --output artifacts/performance/full-evidence-reference.json \
            "${common[@]}" -- \
            "$RUNNER_TEMP/scma-full-evidence/.build/release/scma" debt analyze "$GITHUB_WORKSPACE/Examples/Sources" \
            --format debt-json --jobs 1 \
            --lcov "$GITHUB_WORKSPACE/Tests/SCMACoreTests/Fixtures/CoverageMatching/canonical.lcov" \
            --output "$RUNNER_TEMP/full-evidence-reference-report.json"
          python3 scripts/run_debtmap_benchmark.py \
            --output artifacts/performance/full-evidence-candidate.json \
            "${common[@]}" -- \
            .build/release/scma debt analyze Examples/Sources \
            --format debt-json --jobs 1 \
            --lcov Tests/SCMACoreTests/Fixtures/CoverageMatching/canonical.lcov \
            --output "$RUNNER_TEMP/full-evidence-candidate-report.json"
          .build/release/scma performance-gate \
            artifacts/performance/full-evidence-reference.json \
            artifacts/performance/full-evidence-candidate.json \
            --name full-evidence-analysis \
            --max-wall-clock-regression 20 \
            --max-peak-memory-regression 15 \
            --output artifacts/performance/full-evidence-evaluation.json
          .build/release/scma debt analyze Examples/Sources \
            --format debt-json --jobs 1 \
            --lcov Tests/SCMACoreTests/Fixtures/CoverageMatching/canonical.lcov \
            --output "$RUNNER_TEMP/full-evidence-profile-report.json" \
            --profile-output artifacts/performance/full-evidence-candidate-profile.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debtmap-performance-evidence
          path: artifacts/performance
          if-no-files-found: error
