name: PR quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_conventional_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"

  quality:
    name: Strict build and lint
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select Swift 6.2 toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.2.0"

      - name: Verify Swift toolchain
        run: swift --version | grep 'Swift version 6.2'

      - name: Reject formatter diagnostics
        run: swift format lint --strict --recursive Sources Tests Plugins Package.swift Examples

      - name: Build with compiler warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests without rebuilding
        run: swift test --skip-build
