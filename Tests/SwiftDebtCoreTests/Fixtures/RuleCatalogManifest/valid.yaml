rules:
  - id: concurrency.actor-reentrancy
    semanticRevision: 1
    title: Actor reentrancy after suspension
    category: concurrency
    scope: sourceUnit
    detectionMode: derived
    requirements:
      - syntax
      - isolation
      - controlFlow
      - references
    evidence:
      required:
        all:
          - fact:
              key: invariantEstablished
              kind: controlFlow
          - fact:
              key: suspensionPoint
              kind: isolation
          - fact:
              key: postSuspensionUse
              kind: relationship
          - not:
              fact:
                key: sufficientRevalidation
                kind: controlFlow
    supportState: partial
    provenance:
      researchItem: 19

  - id: errors.force-try
    semanticRevision: 1
    title: Force try suppresses recoverable errors
    category: errorHandling
    scope: syntax
    detectionMode: deterministic
    requirements:
      - syntax
      - references
    evidence:
      required:
        fact:
          key: forceTryPresent
          kind: syntax
      optional:
        - fact:
            key: fallibleExternalBoundary
            kind: relationship
    supportState: supported
    provenance:
      researchItem: 28
      note: broad syntax rule only proves presence of `try!`
